name: Build and Release Android ARM64 APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARM64 APK (Android 8.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect and Rename APK
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          for f in build_output/*.apk; do
            mv "$f" "build_output/Aegis-AI-Agent-arm64-android8+.apk" || true
            break
          done

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.run_number }}
          name: "Aegis AI Agent ARM64 v1.0.${{ github.run_number }}"
          body: |
            ## Aegis AI Agent - Official Release
            - 📱 **Architecture**: `ARM64 (arm64-v8a)`
            - 🤖 **Android Version**: Android 8.0+ (API 26+)
            - ⚡ **Automated Build**: Generated via GitHub Actions CI/CD.
          files: build_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
