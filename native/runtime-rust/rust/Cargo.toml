[package]
name = "aegis-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "aegis_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }
libc = "=0.2.175"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
